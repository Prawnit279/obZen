name: Deploy Obzen to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # v4 of both targeted Node 20, which GitHub now force-runs on Node 24 and
      # warns about on every deploy. The v7 majors target node24 themselves.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Node the build runs on, which is separate from the runtime the
          # actions above use. Pinned to 22 LTS — 20 reached end of life in
          # April 2026, so npm ci and vite would be running on an unsupported
          # runtime every deploy.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
